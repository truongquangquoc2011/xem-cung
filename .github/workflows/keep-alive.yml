name: Keep Render Backend Awake

on:
  schedule:
    # 01:00–18:55 UTC = 08:00 sáng đến 02:00 sáng hôm sau (giờ Việt Nam UTC+7)
    # Nghỉ từ 02:00–08:00 sáng (~540 giờ/tháng, dư ~210 giờ trong gói 750 giờ Render Free)
    - cron: '*/5 1-18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/time
        run: curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 90 https://xem-cung-c7q0.onrender.com/api/time
