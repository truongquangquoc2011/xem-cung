name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /api/time
        run: curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 90 https://xem-cung-c7q0.onrender.com/api/time
