[package]
name = "xem-cung-desktop"
version = "1.0.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
wreq = { version = "6.0.0-rc.31", features = ["stream"] }
wreq-util = "3.0.0-rc.14"
serde = { version = "1", features = ["derive"] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
